---
controls:
version: "cis-1.12"
id: 5
text: "Kubernetes Policies"
type: "policies"
groups:
  - id: 5.1
    text: "RBAC and Service Accounts"
    checks:
      - id: 5.1.1
        text: "Ensure that the cluster-admin role is only used where required (Manual)"
        audit: |
          kubectl get clusterrolebindings -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (.roleRef.name // "") as $ref
              | ((.subjects // []) | map(.name) | join(",")) as $subjects
              | ($m.name != "cluster-admin" and $ref == "cluster-admin") as $bad
              | "kind=ClusterRoleBinding name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " roleRef=\($ref)"
                + (if $subjects == "" then "" else " subjects=\($subjects)" end)
                + " is_compliant=\(if $bad then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Identify all clusterrolebindings to the cluster-admin role. Check if they are used and
          if they need this role or if they could use a role with fewer privileges.
          Where possible, first bind users to a lower privileged role and then remove the
          clusterrolebinding to the cluster-admin role : kubectl delete clusterrolebinding [name]
          Condition: is_compliant is false if rolename is not cluster-admin and rolebinding is cluster-admin.
        scored: false

      - id: 5.1.2
        text: "Minimize access to secrets (Manual)"
        audit: "echo \"canGetListWatchSecretsAsSystemAuthenticated: $(kubectl auth can-i get,list,watch secrets --all-namespaces --as=system:authenticated)\""
        tests:
          test_items:
            - flag: "canGetListWatchSecretsAsSystemAuthenticated"
              compare:
                op: eq
                value: no
        remediation: |
          Where possible, remove get, list and watch access to Secret objects in the cluster.
        scored: false

      - id: 5.1.3
        text: "Minimize wildcard use in Roles and ClusterRoles (Manual)"
        audit: |
          # `contains("[\"*\"]")` over the serialized rules reproduces the previous
          # `grep -q '\["\*"\]'`: a wildcard counts only when an array is exactly ["*"],
          # so verbs like ["get","*"] are not flagged. One API call instead of one per role.
          kubectl get roles,clusterroles --all-namespaces -o json | jq -r '
            [ .items[]
              | .kind as $kind | .metadata as $m
              | ((.rules // []) | tojson | contains("[\"*\"]")) as $wild
              | "kind=\($kind)"
                + (if ($m.namespace // "") == "" then "" else " ns=\($m.namespace)" end)
                + " name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " wildcardRules=\($wild)"
                + " is_compliant=\(if $wild then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Where possible replace any use of wildcards ["*"] in roles and clusterroles with specific
          objects or actions.
          Condition: role_is_compliant is false if ["*"] is found in rules.
          Condition: clusterrole_is_compliant is false if ["*"] is found in rules.
        scored: false

      - id: 5.1.4
        text: "Minimize access to create pods (Manual)"
        audit: |
          echo "canCreatePodsAsSystemAuthenticated: $(kubectl auth can-i create pods --all-namespaces --as=system:authenticated)"
        tests:
          test_items:
            - flag: "canCreatePodsAsSystemAuthenticated"
              compare:
                op: eq
                value: no
        remediation: |
          Where possible, remove create access to pod objects in the cluster.
        scored: false

      - id: 5.1.5
        text: "Ensure that default service accounts are not actively used (Manual)"
        audit: |
          kubectl get serviceaccounts --all-namespaces --field-selector metadata.name=default -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | .automountServiceAccountToken as $amt
              | "kind=ServiceAccount ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " automountServiceAccountToken=\(if $amt == null then "notset" else $amt end)"
                + " is_compliant=\(if $amt == false then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Create explicit service accounts wherever a Kubernetes workload requires specific access
          to the Kubernetes API server.
          Modify the configuration of each default service account to include this value
          `automountServiceAccountToken: false`.
        scored: false

      - id: 5.1.6
        text: "Ensure that Service Account Tokens are only mounted where necessary (Manual)"
        audit: |
          # Two API calls instead of one per pod; the compliance expression below is the
          # same if/elif the shell loop had, including the fall-through to false when the
          # ServiceAccount leaves automountServiceAccountToken unset.
          # Both docs stream in on stdin and are slurped: --argjson would put a whole
          # cluster of JSON on argv and trip ARG_MAX (jq: Argument list too long).
          { kubectl get serviceaccounts --all-namespaces -o json
            kubectl get pods --all-namespaces -o json
          } | jq -rs '
            .[0] as $sas | .[1] |
            [ .items[]
              | .metadata as $m
              | (.spec.serviceAccountName // .spec.serviceAccount // "default") as $sa
              | .spec.automountServiceAccountToken as $pod
              | ([ $sas.items[] | select(.metadata.namespace == $m.namespace and .metadata.name == $sa) ] | first) as $svacc
              | (if $svacc == null then null else $svacc.automountServiceAccountToken end) as $svaccAmt
              | (($svaccAmt == false and ($pod == false or $pod == null))
                 or ($svaccAmt == true and $pod == false)) as $ok
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if (.spec.nodeName // "") == "" then "" else " node=\(.spec.nodeName)" end)
                + " serviceAccount=\($sa)"
                + " podAutomountServiceAccountToken=\(if $pod == null then "notset" else $pod end)"
                + " serviceAccountAutomountServiceAccountToken=\(if $svaccAmt == null then "notset" else $svaccAmt end)"
                + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Modify the definition of ServiceAccounts and Pods which do not need to mount service
          account tokens to disable it, with `automountServiceAccountToken: false`.
          If both the ServiceAccount and the Pod's .spec specify a value for automountServiceAccountToken, the Pod spec takes precedence.
          Condition: Pod is_compliant to true when
            - ServiceAccount is automountServiceAccountToken: false and Pod is automountServiceAccountToken: false or notset
            - ServiceAccount is automountServiceAccountToken: true notset and Pod is automountServiceAccountToken: false
        scored: false

      - id: 5.1.7
        text: "Avoid use of system:masters group (Manual)"
        type: "manual"
        remediation: |
          Remove the system:masters group from all users in the cluster.
        scored: false

      - id: 5.1.8
        text: "Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster (Manual)"
        type: "manual"
        remediation: |
          Where possible, remove the impersonate, bind and escalate rights from subjects.
        scored: false

      - id: 5.1.9
        text: "Minimize access to create persistent volumes (Manual)"
        type: "manual"
        remediation: |
          Where possible, remove create access to PersistentVolume objects in the cluster.
        scored: false

      - id: 5.1.10
        text: "Minimize access to the proxy sub-resource of nodes (Manual)"
        type: "manual"
        remediation: |
          Where possible, remove access to the proxy sub-resource of node objects.
        scored: false

      - id: 5.1.11
        text: "Minimize access to the approval sub-resource of certificatesigningrequests objects (Manual)"
        type: "manual"
        remediation: |
          Where possible, remove access to the approval sub-resource of certificatesigningrequests objects.
        scored: false

      - id: 5.1.12
        text: "Minimize access to webhook configuration objects (Manual)"
        type: "manual"
        remediation: |
          Where possible, remove access to the validatingwebhookconfigurations or mutatingwebhookconfigurations objects
        scored: false

      - id: 5.1.13
        text: "Minimize access to the service account token creation (Manual)"
        type: "manual"
        remediation: |
          Where possible, remove access to the token sub-resource of serviceaccount objects.
        scored: false

  - id: 5.2
    text: "Pod Security Standards"
    checks:
      - id: 5.2.1
        text: "Ensure that the cluster has at least one active policy control mechanism in place (Manual)"
        type: "manual"
        remediation: |
          Ensure that either Pod Security Admission or an external policy control system is in place
          for every namespace which contains user workloads.
        scored: false

      - id: 5.2.2
        text: "Minimize the admission of privileged containers (Manual)"
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (.spec.nodeName // "") as $node
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.containers // [])[]
              | .securityContext.privileged as $priv
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $node == "" then "" else " node=\($node)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " container=\(.name) image=\(.image)"
                + " privileged=\(if $priv == null then "notset" else $priv end)"
                + " is_compliant=\(if $priv == true then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of privileged containers.
          Audit: the audit list all pods' containers to retrieve their .securityContext.privileged value.
          Condition: is_compliant is false if container's `.securityContext.privileged` is set to `true`.
          Default: by default, there are no restrictions on the creation of privileged containers.
        scored: false

      - id: 5.2.3
        text: "Minimize the admission of containers wishing to share the host process ID namespace (Manual)"
        audit: |
          # hostPID is `omitempty` in the PodSpec, so the API omits it when false — the
          # previous `-z` emptiness test and `== true` here give the same verdict.
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (.spec.nodeName // "") as $node
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.hostPID == true) as $bad
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $node == "" then "" else " node=\($node)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " hostPID=\(.spec.hostPID // false)"
                + " is_compliant=\(if $bad then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of `hostPID` containers.
          Audit: the audit retrieves each Pod' spec.hostPID.
          Condition: is_compliant is false if Pod's spec.hostPID is set to `true`.
          Default: by default, there are no restrictions on the creation of hostPID containers.
        scored: false

      - id: 5.2.4
        text: "Minimize the admission of containers wishing to share the host IPC namespace (Manual)"
        audit: |
          # hostIPC is `omitempty` in the PodSpec, so the API omits it when false — the
          # previous `-z` emptiness test and `== true` here give the same verdict.
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (.spec.nodeName // "") as $node
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.hostIPC == true) as $bad
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $node == "" then "" else " node=\($node)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " hostIPC=\(.spec.hostIPC // false)"
                + " is_compliant=\(if $bad then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of `hostIPC` containers.
          Audit: the audit retrieves each Pod' spec.IPC.
          Condition: is_compliant is false if Pod's spec.hostIPC is set to `true`.
          Default: by default, there are no restrictions on the creation of hostIPC containers.
        scored: false

      - id: 5.2.5
        text: "Minimize the admission of containers wishing to share the host network namespace (Manual)"
        audit: |
          # hostNetwork is `omitempty` in the PodSpec, so the API omits it when false — the
          # previous `-z` emptiness test and `== true` here give the same verdict.
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (.spec.nodeName // "") as $node
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.hostNetwork == true) as $bad
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $node == "" then "" else " node=\($node)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " hostNetwork=\(.spec.hostNetwork // false)"
                + " is_compliant=\(if $bad then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of `hostNetwork` containers.
          Audit: the audit retrieves each Pod' spec.hostNetwork.
          Condition: is_compliant is false if Pod's spec.hostNetwork is set to `true`.
          Default: by default, there are no restrictions on the creation of hostNetwork containers.
        scored: false

      - id: 5.2.6
        text: "Minimize the admission of containers with allowPrivilegeEscalation (Manual)"
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (.spec.nodeName // "") as $node
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.containers // [])[]
              | .securityContext.allowPrivilegeEscalation as $ape
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $node == "" then "" else " node=\($node)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " container=\(.name) image=\(.image)"
                + " allowPrivilegeEscalation=\(if $ape == null then "notset" else $ape end)"
                + " is_compliant=\(if $ape == true then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of containers with `.securityContext.allowPrivilegeEscalation` set to `true`.
          Audit: the audit retrieves each Pod's container(s) `.securityContext.allowPrivilegeEscalation`.
          Condition: is_compliant is false if container's `.securityContext.allowPrivilegeEscalation` is set to `true`.
          Default: If notset, privilege escalation is allowed (default to true). However if PSP/PSA is used with a `restricted` profile,
          privilege escalation is explicitly disallowed unless configured otherwise.
        scored: false

      - id: 5.2.7
        text: "Minimize the admission of root containers (Manual)"
        type: "manual"
        remediation: |
          Create a policy for each namespace in the cluster, ensuring that either `MustRunAsNonRoot`
          or `MustRunAs` with the range of UIDs not including 0, is set.
        scored: false

      - id: 5.2.8
        text: "Minimize the admission of containers with the NET_RAW capability (Manual)"
        type: "manual"
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of containers with the `NET_RAW` capability.
        scored: false

      - id: 5.2.9
        text: "Minimize the admission of containers with capabilities assigned (Manual)"
        type: "manual"
        remediation: |
          Review the use of capabilities in applications running on your cluster. Where a
          namespace contains applications which do not require any Linux capabilities to operate
          consider adding a policy which forbids the admission of containers which do not drop all
          capabilities.
        scored: false

      - id: 5.2.10
        text: "Minimize the admission of Windows HostProcess containers (Manual)"
        type: "manual"
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of containers that have `.securityContext.windowsOptions.hostProcess` set to `true`.
        scored: false

      - id: 5.2.11
        text: "Minimize the admission of HostPath volumes (Manual)"
        type: "manual"
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of containers with `hostPath` volumes.
        scored: false

      - id: 5.2.12
        text: "Minimize the admission of containers which use HostPorts (Manual)"
        type: "manual"
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of containers which use `hostPort` sections.
        scored: false

  - id: 5.3
    text: "Network Policies and CNI"
    checks:
      - id: 5.3.1
        text: "Ensure that the CNI in use supports NetworkPolicies (Manual)"
        type: "manual"
        remediation: |
          If the CNI plugin in use does not support network policies, consideration should be given to
          making use of a different plugin, or finding an alternate mechanism for restricting traffic
          in the Kubernetes cluster.
        scored: false

      - id: 5.3.2
        text: "Ensure that all Namespaces have NetworkPolicies defined (Manual)"
        type: "manual"
        remediation: |
          Follow the documentation and create NetworkPolicy objects as you need them.
        scored: false

  - id: 5.4
    text: "Secrets Management"
    checks:
      - id: 5.4.1
        text: "Prefer using Secrets as files over Secrets as environment variables (Manual)"
        type: "manual"
        remediation: |
          If possible, rewrite application code to read Secrets from mounted secret files, rather than
          from environment variables.
        scored: false

      - id: 5.4.2
        text: "Consider external secret storage (Manual)"
        type: "manual"
        remediation: |
          Refer to the Secrets management options offered by your cloud provider or a third-party
          secrets management solution.
        scored: false

  - id: 5.5
    text: "Extensible Admission Control"
    checks:
      - id: 5.5.1
        text: "Configure Image Provenance using ImagePolicyWebhook admission controller (Manual)"
        type: "manual"
        remediation: |
          Follow the Kubernetes documentation and setup image provenance.
        scored: false

  - id: 5.6
    text: "General Policies"
    checks:
      - id: 5.6.1
        text: "Create administrative boundaries between resources using namespaces (Manual)"
        type: "manual"
        remediation: |
          Follow the documentation and create namespaces for objects in your deployment as you need
          them.
        scored: false

      - id: 5.6.2
        text: "Ensure that the seccomp profile is set to docker/default in your Pod definitions (Manual)"
        type: "manual"
        remediation: |
          Use `securityContext` to enable the docker/default seccomp profile in your pod definitions.
          An example is as below:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
        scored: false

      - id: 5.6.3
        text: "Apply SecurityContext to your Pods and Containers (Manual)"
        type: "manual"
        remediation: |
          Follow the Kubernetes documentation and apply SecurityContexts to your Pods. For a
          suggested list of SecurityContexts, you may refer to the CIS Security Benchmark for Docker
          Containers.
        scored: false

      - id: 5.6.4
        text: "The default namespace should not be used (Manual)"
        type: "manual"
        remediation: |
          Ensure that namespaces are created to allow for appropriate segregation of Kubernetes
          resources and that all new resources are created in a specific namespace.
        scored: false
