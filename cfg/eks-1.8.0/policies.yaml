---
controls:
version: "eks-1.8.0"
id: 4
text: "Policies"
type: "policies"
# Audit rows are space-separated key=value tokens, the same contract cloudanix-1.0 uses:
# `kind=` marks the row as a Kubernetes object and drives check.FailedResource, and any key
# that is not reserved lands in `attributes`. Optional tokens are omitted rather than
# emitted empty — jq renders a missing field as the literal string "null". An audit that
# matches nothing emits the `is_compliant=true` sentinel and passes. This is what lets a
# standalone eks-1.8.0 run name the offending objects instead of only reporting that some
# exist. See docs-internal/misconfig-cbp/failed-resources.md.
#
# Each audit keeps the pass/fail semantics of the sentinel-string version it replaced — the
# same resource scope, the same violation condition — so only the reporting changed.
groups:
  - id: 4.1
    text: "RBAC and Service Accounts"
    checks:
      - id: 4.1.1
        text: "Ensure that the cluster-admin role is only used where required (Automated)"
        audit: |
          kubectl get clusterrolebindings -o json | jq -r '
            [ .items[]
              | select(.roleRef.name == "cluster-admin")
              | .metadata as $m
              | ((.subjects // [])[] | select(.kind != "Group" or (.name != "system:masters" and .name != "system:nodes")))
              | "kind=ClusterRoleBinding name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " subjectKind=\(.kind) subject=\(.name)"
                + (if (.namespace // "") == "" then "" else " subjectNamespace=\(.namespace)" end)
                + " roleRef=cluster-admin is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Identify all clusterrolebindings to the cluster-admin role. Check if they are used and if
          they need this role or if they could use a role with fewer privileges.
          Where possible, first bind users to a lower privileged role and then remove the
          clusterrolebinding to the cluster-admin role :
          kubectl delete clusterrolebinding [name]
        scored: true

      - id: 4.1.2
        text: "Minimize access to secrets (Automated)"
        audit: |
          kubectl get roles --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | [ .rules[]?
                  | select((any(.resources[]?; . == "secrets"))
                    and (any(.verbs[]?; . == "get" or . == "list" or . == "watch")))
                  | (.verbs // []) | join(",") ] as $verbs
              | select(($verbs | length) > 0)
              | "kind=Role ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " resource=secrets verbs=\($verbs | join("|")) is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Where possible, remove get, list and watch access to secret objects in the cluster.
        scored: true

      - id: 4.1.3
        text: "Minimize wildcard use in Roles and ClusterRoles (Automated)"
        audit: |
          kubectl get roles,clusterroles --all-namespaces -o json | jq -r '
            [ .items[]
              | .kind as $kind | .metadata as $m
              | [ .rules[]?
                  | select((any(.verbs[]?; . == "*")) or (any(.resources[]?; . == "*")) or (any(.apiGroups[]?; . == "*"))) ] as $wild
              | select(($wild | length) > 0)
              | "kind=\($kind)"
                + (if ($m.namespace // "") == "" then "" else " ns=\($m.namespace)" end)
                + " name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " wildcardRules=\($wild | length) is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Where possible replace any use of wildcards in clusterroles and roles with specific
          objects or actions.
        scored: true

      - id: 4.1.4
        text: "Minimize access to create pods (Automated)"
        audit: |
          kubectl get roles,clusterroles --all-namespaces -o json | jq -r '
            [ .items[]
              | .kind as $kind | .metadata as $m
              | select(any(.rules[]?; (any(.resources[]?; . == "pods")) and (any(.verbs[]?; . == "create"))))
              | "kind=\($kind)"
                + (if ($m.namespace // "") == "" then "" else " ns=\($m.namespace)" end)
                + " name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " resource=pods verb=create is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Where possible, remove create access to pod objects in the cluster.
        scored: true

      - id: 4.1.5
        text: "Ensure that default service accounts are not actively used. (Automated)"
        audit: |
          pods=$(kubectl get pods --all-namespaces -o json)
          kubectl get serviceaccounts --all-namespaces -o json | jq -r --argjson pods "$pods" '
            [ ( .items[]
                | select(.metadata.name == "default" and (.automountServiceAccountToken != false))
                | .metadata as $m
                | "kind=ServiceAccount ns=\($m.namespace) name=default uid=\($m.uid) apiVersion=v1"
                  + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                  + " automountServiceAccountToken=\(if .automountServiceAccountToken == null then "unset" else .automountServiceAccountToken end)"
                  + " reason=token_automounted is_compliant=false" ),
              ( $pods.items[]
                | select(.spec.serviceAccountName == "default")
                | .metadata as $m
                | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                  + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                  + (if (.spec.nodeName // "") == "" then "" else " node=\(.spec.nodeName)" end)
                  + " serviceAccount=default reason=default_sa_in_use is_compliant=false" )
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Create explicit service accounts wherever a Kubernetes workload requires specific
          access to the Kubernetes API server.
          Modify the configuration of each default service account to include this value
          automountServiceAccountToken: false
          Automatic remediation for the default account:
          kubectl patch serviceaccount default -p
          $'automountServiceAccountToken: false'
        scored: true

      - id: 4.1.6
        text: "Ensure that Service Account Tokens are only mounted where necessary (Automated)"
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.automountServiceAccountToken == false) as $ok
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if (.spec.nodeName // "") == "" then "" else " node=\(.spec.nodeName)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " serviceAccount=\(.spec.serviceAccountName // "default")"
                + " automountServiceAccountToken=\(if .spec.automountServiceAccountToken == null then "unset" else .spec.automountServiceAccountToken end)"
                + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Regularly review pod and service account objects in the cluster to ensure that the automountServiceAccountToken setting is false for pods and accounts that do not explicitly require API server access.
        scored: true

      - id: 4.1.7
        text: "Cluster Access Manager API to streamline and enhance the management of access controls within EKS clusters (Manual)"
        type: "manual"
        remediation: |
          Log in to the AWS Management Console.
            Navigate to Amazon EKS and select your EKS cluster.

            Go to the Access tab and click on "Manage Access" in the "Access Configuration section".
            Under Cluster Authentication Mode for Cluster Access settings.
            Click EKS API to change cluster will source authenticated IAM principals only from EKS access entry APIs.
            Click ConfigMap to change cluster will source authenticated IAM principals only from the aws-auth ConfigMap.
          Note: EKS API and ConfigMap must be selected during Cluster creation and cannot be changed once the Cluster is provisioned.
        scored: false

      - id: 4.1.8
        text: "Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster (Manual)"
        type: "manual"
        remediation: |
          Where possible, remove the impersonate, bind and escalate rights from subjects.
        scored: false

      - id: 4.1.9
        text: "Minimize access to create PersistentVolume objects (Manual)"
        type: "manual"
        remediation: |
          Review the RBAC rules in the cluster and identify users, groups, or service accounts
          with create permissions on PersistentVolume resources.
          Where possible, remove or restrict create access to PersistentVolume objects to
          trusted administrators only.
        scored: false

      - id: 4.1.10
        text: "Minimize access to the proxy sub-resource of Node objects (Manual)"
        type: "manual"
        remediation: |
          Review RBAC roles and bindings in the cluster to identify users, groups,
          or service accounts with access to the proxy sub-resource of Node objects.
          Where possible, remove or restrict access to the node proxy sub-resource
          to trusted administrators only.
        scored: false

      - id: 4.1.11
        text: "Minimize access to webhook configuration objects (Manual)"
        type: "manual"
        remediation: |
          Review RBAC roles and bindings in the cluster to identify users, groups,
          or service accounts with access to validatingwebhookconfigurations or
          mutatingwebhookconfigurations objects. Where possible, remove or restrict
          access to these webhook configuration objects to trusted administrators only.
        scored: false

      - id: 4.1.12
        text: "Minimize access to the service account token creation (Manual)"
        type: "manual"
        remediation: |
          Review RBAC roles and bindings in the cluster to identify users, groups,
          or service accounts with access to create the token sub-resource of
          serviceaccount objects. Where possible, remove or restrict access to
          token creation to trusted administrators only.
        scored: false

  - id: 4.2
    text: "Pod Security Standards"
    checks:
      - id: 4.2.1
        text: "Minimize the admission of privileged containers (Automated)"
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (.spec.nodeName // "") as $node
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.containers // [])[]
              | (.securityContext.privileged // false) as $priv
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $node == "" then "" else " node=\($node)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " container=\(.name) image=\(.image) privileged=\($priv)"
                + " is_compliant=\(if $priv then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the admission of privileged containers.
            To enable PSA for a namespace in your cluster, set the pod-security.kubernetes.io/enforce label with the policy value you want to enforce.
            kubectl label --overwrite ns NAMESPACE pod-security.kubernetes.io/enforce=restricted
            The above command enforces the restricted policy for the NAMESPACE namespace.
          You can also enable Pod Security Admission for all your namespaces. For example:
            kubectl label --overwrite ns --all pod-security.kubernetes.io/warn=baseline
        scored: true

      - id: 4.2.2
        text: "Minimize the admission of containers wishing to share the host process ID namespace (Automated)"
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (.spec.nodeName // "") as $node
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.hostPID == true) as $bad
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $node == "" then "" else " node=\($node)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " hostPID=\(.spec.hostPID // false)"
                + " is_compliant=\(if $bad then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of hostPID containers.
        scored: true

      - id: 4.2.3
        text: "Minimize the admission of containers wishing to share the host IPC namespace (Automated)"
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (.spec.nodeName // "") as $node
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.hostIPC == true) as $bad
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $node == "" then "" else " node=\($node)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " hostIPC=\(.spec.hostIPC // false)"
                + " is_compliant=\(if $bad then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of hostIPC containers.
        scored: true

      - id: 4.2.4
        text: "Minimize the admission of containers wishing to share the host network namespace (Automated)"
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (.spec.nodeName // "") as $node
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.hostNetwork == true) as $bad
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $node == "" then "" else " node=\($node)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " hostNetwork=\(.spec.hostNetwork // false)"
                + " is_compliant=\(if $bad then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of hostNetwork containers.
        scored: true

      - id: 4.2.5
        text: "Minimize the admission of containers with allowPrivilegeEscalation (Automated)"
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (.spec.nodeName // "") as $node
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.containers // [])[]
              | (.securityContext.allowPrivilegeEscalation == true) as $bad
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $node == "" then "" else " node=\($node)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " container=\(.name) image=\(.image)"
                + " allowPrivilegeEscalation=\(if .securityContext.allowPrivilegeEscalation == null then "unset" else .securityContext.allowPrivilegeEscalation end)"
                + " is_compliant=\(if $bad then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Add policies to each namespace in the cluster which has user workloads to restrict the
          admission of containers with .spec.allowPrivilegeEscalation set to true.
        scored: true

  - id: 4.3
    text: "CNI Plugin"
    checks:
      - id: 4.3.1
        text: "Ensure CNI plugin supports network policies (Manual)"
        type: "manual"
        remediation: |
          As with RBAC policies, network policies should adhere to the policy of least privileged
          access. Start by creating a deny all policy that restricts all inbound and outbound traffic
          from a namespace or create a global policy using Calico.
        scored: false

      - id: 4.3.2
        text: "Ensure that all Namespaces have Network Policies defined (Automated)"
        audit: |
          nps=$(kubectl get networkpolicies --all-namespaces -o json)
          kubectl get namespaces -o json | jq -r --argjson nps "$nps" '
            [ .items[]
              | .metadata as $m
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ $nps.items[] | select(.metadata.namespace == $m.name) ] | length) as $count
              | "kind=Namespace name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + " networkPolicies=\($count)"
                + " is_compliant=\(if $count > 0 then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Create at least one NetworkPolicy in each namespace to control and restrict traffic between pods as needed.
        scored: true

  - id: 4.4
    text: "Secrets Management"
    checks:
      - id: 4.4.1
        text: "Prefer using secrets as files over secrets as environment variables (Automated)"
        audit: |
          kubectl get all --all-namespaces -o json | jq -r '
            [ .items[]
              | .kind as $kind | .apiVersion as $api | .metadata as $m
              | [ .. | objects | select(has("secretKeyRef")) ] as $refs
              | select(($refs | length) > 0)
              | "kind=\($kind)"
                + (if ($m.namespace // "") == "" then "" else " ns=\($m.namespace)" end)
                + " name=\($m.name) uid=\($m.uid)"
                + (if ($api // "") == "" then "" else " apiVersion=\($api)" end)
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " secretEnvRefs=\($refs | length) is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          If possible, rewrite application code to read secrets from mounted secret files, rather than
          from environment variables.
        scored: true

      - id: 4.4.2
        text: "Consider external secret storage (Manual)"
        type: "manual"
        remediation: |
          Refer to the secrets management options offered by your cloud provider or a third-party
          secrets management solution.
        scored: false

  - id: 4.5
    text: "General Policies"
    checks:
      - id: 4.5.1
        text: "Create administrative boundaries between resources using namespaces (Manual)"
        type: "manual"
        remediation: |
          Follow the documentation and create namespaces for objects in your deployment as you need
          them.
        scored: false

      - id: 4.5.2
        text: "The default namespace should not be used (Automated)"
        audit: |
          kubectl get $(kubectl api-resources --verbs=list --namespaced=true -o name | paste -sd, -) --ignore-not-found -n default -o json | jq -r '
            [ .items[]
              | .kind as $kind | .apiVersion as $api | .metadata as $m
              | select($kind != "Service" or $m.name != "kubernetes")
              | "kind=\($kind) ns=default name=\($m.name) uid=\($m.uid)"
                + (if ($api // "") == "" then "" else " apiVersion=\($api)" end)
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Create and use dedicated namespaces for resources instead of the default namespace. Move any user-defined objects out of the default namespace to improve resource segregation and RBAC control.
        scored: true
