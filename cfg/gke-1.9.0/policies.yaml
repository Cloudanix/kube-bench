---
controls:
version: "gke-1.9.0"
id: 4
text: "Kubernetes Policies"
type: "policies"
groups:
  - id: 4.1
    text: "RBAC and Service Accounts"
    checks:
      - id: 4.1.1
        text: "Ensure that the cluster-admin role is only used where required (Manual)"
        audit: |
          kubectl get clusterrolebindings -o json | jq -r '
            [ .items[]
              | select(.roleRef.name == "cluster-admin")
              | .metadata as $m
              | ((.subjects // [])[] | select(.kind != "Group" or .name != "system:masters"))
              | "kind=ClusterRoleBinding name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " subjectKind=\(.kind) subject=\(.name)"
                + (if (.namespace // "") == "" then "" else " subjectNamespace=\(.namespace)" end)
                + " roleRef=cluster-admin is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Identify all ClusterRoleBindings to the "cluster-admin" role and review their subjects:

            kubectl get clusterrolebindings -o=custom-columns=NAME:.metadata.name,ROLE:.roleRef.name,SUBJECTS:.subjects[*].name | grep cluster-admin

          If non-system principals (users, groups, or service accounts) do not strictly require cluster-admin,
          rebind them to a least-privileged (Cluster)Role and then remove the excessive binding:

            kubectl delete clusterrolebinding <binding-name>

          Notes:
          - Do not modify bindings with the "system:" prefix that are required for core components.
          - Prefer assigning narrowly scoped Roles/ClusterRoles that grant only the permissions needed.
        scored: true

      - id: 4.1.2
        text: "Minimize access to secrets (Manual)"
        audit: |
          kubectl get roles --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | [ .rules[]?
                  | select((any(.resources[]?; . == "secrets"))
                    and (any(.verbs[]?; . == "get" or . == "list" or . == "watch")))
                  | (.verbs // []) | join(",") ] as $verbs
              | select(($verbs | length) > 0)
              | "kind=Role ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " resource=secrets verbs=\($verbs | join("|")) is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Where possible, remove get, list and watch access to Secret objects in the cluster.
        scored: true

      - id: 4.1.3
        text: "Minimize wildcard use in Roles and ClusterRoles (Manual)"
        audit: |
          kubectl get roles,clusterroles --all-namespaces -o json | jq -r '
            [ .items[]
              | .kind as $kind | .metadata as $m
              | [ .rules[]?
                  | select((any(.verbs[]?; . == "*")) or (any(.resources[]?; . == "*")) or (any(.apiGroups[]?; . == "*"))) ] as $wild
              | select(($wild | length) > 0)
              | "kind=\($kind)"
                + (if ($m.namespace // "") == "" then "" else " ns=\($m.namespace)" end)
                + " name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " wildcardRules=\($wild | length) is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Where possible replace any use of wildcards in clusterroles and roles with specific
          objects or actions.
        scored: true

      - id: 4.1.4
        text: "Ensure that default service accounts are not actively used (Automated)"
        audit: |
          # Both docs stream in on stdin and are slurped: --argjson would put a whole
          # cluster of JSON on argv and trip ARG_MAX (jq: Argument list too long).
          { kubectl get pods --all-namespaces -o json
            kubectl get serviceaccounts --all-namespaces -o json
          } | jq -rs '
            .[0] as $pods | .[1] |
            [ ( .items[]
                | select(.metadata.name == "default" and (.automountServiceAccountToken != false))
                | .metadata as $m
                | "kind=ServiceAccount ns=\($m.namespace) name=default uid=\($m.uid) apiVersion=v1"
                  + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                  + " automountServiceAccountToken=\(if .automountServiceAccountToken == null then "notset" else .automountServiceAccountToken end)"
                  + " reason=token_automounted is_compliant=false" ),
              ( $pods.items[]
                | select(.spec.serviceAccountName == "default")
                | .metadata as $m
                | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                  + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                  + (if (.spec.nodeName // "") == "" then "" else " node=\(.spec.nodeName)" end)
                  + " serviceAccount=default reason=default_sa_in_use is_compliant=false" )
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Create explicit service accounts wherever a Kubernetes workload requires specific
          access to the Kubernetes API server.

          Modify the configuration of each default service account to include this value

            automountServiceAccountToken: false
        scored: true

      - id: 4.1.5
        text: "Ensure that Service Account Tokens are only mounted where necessary (Manual)"
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | .metadata as $m
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | (.spec.automountServiceAccountToken == false) as $ok
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if (.spec.nodeName // "") == "" then "" else " node=\(.spec.nodeName)" end)
                + (if $labels == "" then "" else " labels=\($labels)" end)
                + (if $own == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " serviceAccount=\(.spec.serviceAccountName // "default")"
                + " automountServiceAccountToken=\(if .spec.automountServiceAccountToken == null then "notset" else .spec.automountServiceAccountToken end)"
                + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Modify the definition of pods and service accounts which do not need to mount service
          account tokens to disable it.
        scored: true

      - id: 4.1.6
        text: "Avoid use of system:masters group (Automated)"
        audit: |
          # The openssl decode stays — jq cannot parse a PKCS#10 request. Only the output
          # shape changed, so each offending CSR is now named individually.
          found=0
          for csr in $(kubectl get csr -o name 2>/dev/null | sed 's|^.*/||'); do
            req=$(kubectl get csr "${csr}" -o jsonpath='{.spec.request}' 2>/dev/null)
            [ -z "${req}" ] && continue
            if echo "${req}" | base64 -d 2>/dev/null | openssl req -noout -text 2>/dev/null | grep -q 'O = system:masters'; then
              kubectl get csr "${csr}" -o json | jq -r '
                .metadata as $m
                | "kind=CertificateSigningRequest name=\($m.name) uid=\($m.uid) apiVersion=certificates.k8s.io/v1"
                  + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                  + " organization=system:masters"
                  + " conditions=\((([.status.conditions[]?.type] | join(",")) // "") | if . == "" then "NONE" else . end)"
                  + " is_compliant=false"'
              found=1
            fi
          done
          if [ "${found}" -eq 0 ]; then
            echo "is_compliant=true"
          fi
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Remove the system:masters group from all users in the cluster.
        scored: true

      - id: 4.1.7
        text: "Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster (Manual)"
        type: "manual"
        audit: |
          kubectl get clusterrole,role -A -o json | jq -r '
            def risky_verbs: ["bind","impersonate","escalate"];

            .items[]
            | . as $r
            | [ $r.rules[]?
                | select(
                    (.verbs // [] | any(. as $v | $v == "bind" or $v == "impersonate" or $v == "escalate"))
                  )
                | {
                    resources: ((.resources // ["*"]) | join(",")),
                    verbs: ((.verbs // []) | map(select(IN("bind","impersonate","escalate"))) | join(","))
                  }
              ] as $matches
            | select($matches | length > 0)
            | [
                $r.kind,
                $r.metadata.name,
                ($r.metadata.namespace // "cluster-wide"),
                ($matches | map(.resources) | unique | join(",")),
                ($matches | map(.verbs) | unique | join(","))
              ] | @tsv
          ' | awk -F'\t' 'BEGIN{
            printf "%-15s %-40s %-20s %-40s %-30s\n","KIND","NAME","NAMESPACE","RESOURCES","VERBS"
            print  "--------------- ---------------------------------------- -------------------- ---------------------------------------- ------------------------------"
          }{
            printf "%-15s %-40s %-20s %-40s %-30s\n",$1,$2,$3,$4,$5
          }'
        remediation: |
          Where possible, remove the impersonate, bind and escalate rights from subjects.
        scored: false

      - id: 4.1.8
        text: "Avoid bindings to system:anonymous (Automated)"
        audit: |
          # Flags any ClusterRoleBinding/RoleBinding that targets the user "system:anonymous".
          (
            kubectl get clusterrolebindings -o json | jq -r '
              .items[]
              | select((.subjects | length) > 0)
              | select(any(.subjects[]?; .kind == "User" and .name == "system:anonymous"))
              | .metadata as $m
              | "kind=ClusterRoleBinding name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " subject=system:anonymous roleRef=\(.roleRef.kind)/\(.roleRef.name) is_compliant=false"
            ';
            kubectl get rolebindings -A -o json | jq -r '
              .items[]
              | select((.subjects | length) > 0)
              | select(any(.subjects[]?; .kind == "User" and .name == "system:anonymous"))
              | .metadata as $m
              | "kind=RoleBinding"
                + (if ($m.namespace // "") == "" then "" else " ns=\($m.namespace)" end)
                + " name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " subject=system:anonymous roleRef=\(.roleRef.kind)/\(.roleRef.name) is_compliant=false"
            '
          ) | (grep -q '^kind=' && cat || echo 'is_compliant=true')
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Identify all clusterrolebindings and rolebindings to the user system:anonymous.
          Check if they are used and review the permissions associated with the binding using the
          commands in the Audit section above or refer to GKE documentation
          (https://cloud.google.com/kubernetes-engine/docs/best-practices/rbac#detect-prevent-default).

          Strongly consider replacing unsafe bindings with an authenticated, user-defined group.
          Where possible, bind to non-default, user-defined groups with least-privilege roles.

          If there are any unsafe bindings to the user system:anonymous, proceed to delete them
          after consideration for cluster operations with only necessary, safer bindings.

            kubectl delete clusterrolebinding [CLUSTER_ROLE_BINDING_NAME]
            kubectl delete rolebinding [ROLE_BINDING_NAME] --namespace [ROLE_BINDING_NAMESPACE]
        scored: true

      - id: 4.1.9
        text: "Avoid non-default bindings to system:unauthenticated (Automated)"
        audit: |
          # Flags any non-default binding to the group "system:unauthenticated".
          (
            kubectl get clusterrolebindings -o json | jq -r '
              .items[]
              | select(.metadata.name != "system:public-info-viewer")
              | select((.subjects | length) > 0)
              | select(any(.subjects[]?; .kind == "Group" and .name == "system:unauthenticated"))
              | .metadata as $m
              | "kind=ClusterRoleBinding name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " subject=system:unauthenticated roleRef=\(.roleRef.kind)/\(.roleRef.name) is_compliant=false"
            ';
            kubectl get rolebindings -A -o json | jq -r '
              .items[]
              | select((.subjects | length) > 0)
              | select(any(.subjects[]?; .kind == "Group" and .name == "system:unauthenticated"))
              | .metadata as $m
              | "kind=RoleBinding"
                + (if ($m.namespace // "") == "" then "" else " ns=\($m.namespace)" end)
                + " name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " subject=system:unauthenticated roleRef=\(.roleRef.kind)/\(.roleRef.name) is_compliant=false"
            '
          ) | (grep -q "^kind=" && cat || echo "is_compliant=true")
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Identify all non-default clusterrolebindings and rolebindings to the group
          system:unauthenticated. Check if they are used and review the permissions
          associated with the binding using the commands in the Audit section above or refer to
          GKE documentation (https://cloud.google.com/kubernetes-engine/docs/best-practices/rbac#detect-prevent-default).

          Strongly consider replacing non-default, unsafe bindings with an authenticated, user-
          defined group. Where possible, bind to non-default, user-defined groups with least-
          privilege roles.

          If there are any non-default, unsafe bindings to the group system:unauthenticated,
          proceed to delete them after consideration for cluster operations with only necessary,
          safer bindings.

            kubectl delete clusterrolebinding [CLUSTER_ROLE_BINDING_NAME]
            kubectl delete rolebinding [ROLE_BINDING_NAME] --namespace [ROLE_BINDING_NAMESPACE]
        scored: true

      - id: 4.1.10
        text: "Avoid non-default bindings to system:authenticated (Automated)"
        audit: |
          # Flags any non-default binding to the group "system:authenticated".
          # Allowed defaults (CRB): system:basic-user, system:discovery
          (
            kubectl get clusterrolebindings -o json | jq -r '
              .items[]
              | select((.metadata.name != "system:basic-user") and (.metadata.name != "system:discovery"))
              | select((.subjects | length) > 0)
              | select(any(.subjects[]?; .kind == "Group" and .name == "system:authenticated"))
              | .metadata as $m
              | "kind=ClusterRoleBinding name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " subject=system:authenticated roleRef=\(.roleRef.kind)/\(.roleRef.name) is_compliant=false"
            ';
            kubectl get rolebindings -A -o json | jq -r '
              .items[]
              | select((.subjects | length) > 0)
              | select(any(.subjects[]?; .kind == "Group" and .name == "system:authenticated"))
              | .metadata as $m
              | "kind=RoleBinding"
                + (if ($m.namespace // "") == "" then "" else " ns=\($m.namespace)" end)
                + " name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " subject=system:authenticated roleRef=\(.roleRef.kind)/\(.roleRef.name) is_compliant=false"
            '
          ) | (grep -q "^kind=" && cat || echo "is_compliant=true")
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Identify all non-default clusterrolebindings and rolebindings to the group
          system:authenticated. Check if they are used and review the permissions associated
          with the binding using the commands in the Audit section above or refer to GKE
          documentation.

          Strongly consider replacing non-default, unsafe bindings with an authenticated, user-
          defined group. Where possible, bind to non-default, user-defined groups with least-
          privilege roles.

          If there are any non-default, unsafe bindings to the group system:authenticated,
          proceed to delete them after consideration for cluster operations with only necessary,
          safer bindings.

            kubectl delete clusterrolebinding [CLUSTER_ROLE_BINDING_NAME]
            kubectl delete rolebinding [ROLE_BINDING_NAME] --namespace [ROLE_BINDING_NAMESPACE]
        scored: true

  - id: 4.2
    text: "Pod Security Standards"
    checks:
      - id: 4.2.1
        text: "Ensure that the cluster enforces Pod Security Standard Baseline profile or stricter for all namespaces. (Manual)"
        audit: |
          diff \
            <(kubectl get namespace -l pod-security.kubernetes.io/enforce=baseline -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}') \
            <(kubectl get namespace -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}')
        type: "manual"
        remediation: |
          Ensure that Pod Security Admission is in place for every namespace which contains
          user workloads.
          Run the following command to enforce the Baseline profile in a namespace:

            kubectl label namespace pod-security.kubernetes.io/enforce=baseline
        scored: false

  - id: 4.3
    text: "Network Policies and CNI"
    checks:
      - id: 4.3.1
        text: "Ensure that the CNI in use supports Network Policies (Manual)"
        type: "manual"
        remediation: |
          To use a CNI plugin with Network Policy, enable Network Policy in GKE, and the CNI plugin
          will be updated. See Recommendation 5.6.7.
        scored: false

      - id: 4.3.2
        text: "Ensure that all Namespaces have Network Policies defined (Automated)"
        audit: |
          (kubectl get ns -o json; kubectl get networkpolicy -A -o json) \
          | jq -rs '
            ( (.[1].items // [])
              | sort_by(.metadata.namespace)
              | group_by(.metadata.namespace)
              | map({key: .[0].metadata.namespace, value: length})
              | from_entries
            ) as $np
            | [ .[0].items[]
                | select(.metadata.name as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
                | .metadata as $m
                | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
                | ($np[$m.name] // 0) as $count
                | "kind=Namespace name=\($m.name) uid=\($m.uid) apiVersion=v1"
                  + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                  + (if $labels == "" then "" else " labels=\($labels)" end)
                  + " networkPolicies=\($count)"
                  + " is_compliant=\(if $count > 0 then "true" else "false" end)"
              ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end
          '
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Follow the documentation and create NetworkPolicy objects as needed.
          See: https://cloud.google.com/kubernetes-engine/docs/how-to/network-policy#creating_a_network_policy
          for more information.
        scored: true

  - id: 4.4
    text: "Secrets Management"
    checks:
      - id: 4.4.1
        text: "Prefer using secrets as files over secrets as environment variables (Automated)"
        audit: |
          kubectl get all --all-namespaces -o json | jq -r '
            [ .items[]
              | .kind as $kind | .apiVersion as $api | .metadata as $m
              | [ .. | objects | select(has("secretKeyRef")) ] as $refs
              | select(($refs | length) > 0)
              | "kind=\($kind)"
                + (if ($m.namespace // "") == "" then "" else " ns=\($m.namespace)" end)
                + " name=\($m.name) uid=\($m.uid)"
                + (if ($api // "") == "" then "" else " apiVersion=\($api)" end)
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " secretEnvRefs=\($refs | length) is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          If possible, rewrite application code to read secrets from mounted secret files, rather than
          from environment variables.
        scored: true

      - id: 4.4.2
        text: "Consider external secret storage (Manual)"
        type: "manual"
        remediation: |
          Refer to the secrets management options offered by your cloud provider or a third-party
          secrets management solution.
        scored: false

  - id: 4.5
    text: "Extensible Admission Control"
    checks:
      - id: 4.5.1
        text: "Configure Image Provenance using ImagePolicyWebhook admission controller (Manual)"
        type: "manual"
        remediation: |
          Follow the Kubernetes documentation and setup image provenance.
          Also see recommendation 5.1.4.
        scored: false

  - id: 4.6
    text: "General Policies"
    checks:
      - id: 4.6.1
        text: "Create administrative boundaries between resources using namespaces (Manual)"
        type: "manual"
        audit: |
          kubectl get namespaces
        remediation: |
          Follow the documentation and create namespaces for objects in your deployment as you need
          them.
        scored: false

      - id: 4.6.2
        text: "Ensure that the seccomp profile is set to RuntimeDefault in your pod definitions (Automated)"
        type: "manual"
        audit: |
          kubectl get pods --all-namespaces -o json |\
           jq -r '.items[] | select(.metadata.annotations."seccomp.security.alpha.kubernetes.io/pod" == "runtime/default" or .spec.securityContext.seccompProfile.type == "RuntimeDefault") | {namespace: .metadata.namespace, name: .metadata.name, seccompProfile: .spec.securityContext.seccompProfile.type}'
        remediation: |
          Use security context to enable the RuntimeDefault seccomp profile in your pod
          definitions. An example is as below:

            {
              "namespace": "kube-system",
              "name": "metrics-server-v0.7.0-dbcc8ddf6-gz7d4",
              "seccompProfile": "RuntimeDefault"
            }
        scored: false

      - id: 4.6.3
        text: "Apply Security Context to Pods and Containers (Manual)"
        type: "manual"
        remediation: |
          Follow the Kubernetes documentation and apply security contexts to your pods. For a
          suggested list of security contexts, you may refer to the CIS Google Container-
          Optimized OS Benchmark.
        scored: false

      - id: 4.6.4
        text: "The default namespace should not be used (Manual)"
        audit: |
          kubectl get all -n default -o json | jq -r '
            [ .items[]
              | .kind as $kind | .apiVersion as $api | .metadata as $m
              | select($kind != "Service" or $m.name != "kubernetes")
              | "kind=\($kind) ns=default name=\($m.name) uid=\($m.uid)"
                + (if ($api // "") == "" then "" else " apiVersion=\($api)" end)
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
