---
controls:
version: "cloudanix-1.0"
id: 1
text: "Workload & Tenancy Best Practices"
type: "policies"
# Audit rows are space-separated key=value tokens. `kind=` marks the row as a Kubernetes
# object and drives check.FailedResource; any key that is not reserved lands in `attributes`.
# Optional tokens are omitted rather than emitted empty — jq renders a missing field as the
# literal string "null". See docs-internal/misconfig-cbp/failed-resources.md.
groups:
  - id: 1
    text: "Workload Security (Pod & Container Spec)"
    checks:
      - id: C1.1
        text: "No container runs in privileged mode (Automated)"
        severity: critical
        references: ["cis:5.2.2", "eks:4.2.1", "aks:4.2.1"]
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | ((.spec.containers // []) + (.spec.initContainers // []))[]
            | (.securityContext.privileged // false) as $priv
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " container=\(.name) image=\(.image) privileged=\($priv)"
              + " is_compliant=\(if $priv then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Remove `securityContext.privileged: true` from the container spec. If the
          workload needs specific kernel capabilities, add only those via
          `securityContext.capabilities.add` instead of granting full privilege.
          A privileged container can compromise the node and other pods on it.
        scored: true

      - id: C1.2
        text: "No pod shares a host namespace (hostPID/hostIPC/hostNetwork) (Automated)"
        severity: critical
        references: ["cis:5.2.3", "cis:5.2.4", "cis:5.2.5", "eks:4.2.2", "eks:4.2.3", "eks:4.2.4", "aks:4.2.2", "aks:4.2.3", "aks:4.2.4"]
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | (.spec.hostPID // false) as $hostPID
            | (.spec.hostIPC // false) as $hostIPC
            | (.spec.hostNetwork // false) as $hostNet
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " hostPID=\($hostPID) hostIPC=\($hostIPC) hostNetwork=\($hostNet)"
              + " is_compliant=\(if ($hostPID or $hostIPC or $hostNet) then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Set `hostPID`, `hostIPC` and `hostNetwork` to false (or omit them) in the
          pod spec. Sharing a host namespace breaks the isolation boundary between
          the pod and the node.
        scored: true

      - id: C1.3
        text: "Containers run as non-root (Automated)"
        severity: high
        references: ["cis:5.2.7"]
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | (.spec.securityContext.runAsNonRoot // false) as $podNonRoot
            | ((.spec.containers // []) + (.spec.initContainers // []))[]
            | ($podNonRoot or (.securityContext.runAsNonRoot // false)) as $ok
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " container=\(.name) image=\(.image) runAsNonRoot=\($ok)"
              + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Set `securityContext.runAsNonRoot: true` at the pod level or on every
          container. Running as root inside a container widens the impact of a
          container escape.
        scored: true

      - id: C1.4
        text: "Containers disallow privilege escalation (Automated)"
        severity: high
        references: ["cis:5.2.6", "eks:4.2.5", "aks:4.2.5"]
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | ((.spec.containers // []) + (.spec.initContainers // []))[]
            | (.securityContext.allowPrivilegeEscalation == false) as $ok
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " container=\(.name) image=\(.image)"
              + " allowPrivilegeEscalation=\(if .securityContext.allowPrivilegeEscalation == null then "unset" else .securityContext.allowPrivilegeEscalation end)"
              + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Set `securityContext.allowPrivilegeEscalation: false` on every container.
          It defaults to true, letting a process gain more privileges than its parent.
        scored: true

      - id: C1.5
        text: "Containers drop ALL capabilities (Automated)"
        severity: high
        references: ["cis:5.2.9"]
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | ((.spec.containers // []) + (.spec.initContainers // []))[]
            | (.securityContext.capabilities.drop // []) as $drop
            | (($drop | index("ALL")) or ($drop | index("all"))) as $ok
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " container=\(.name) image=\(.image)"
              + " capabilitiesDrop=\(if ($drop | length) == 0 then "none" else ($drop | join("+")) end)"
              + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Add `securityContext.capabilities.drop: ["ALL"]` to every container and
          add back only the specific capabilities the workload needs.
        scored: true

      - id: C1.6
        text: "Containers use a read-only root filesystem (Automated)"
        severity: medium
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | ((.spec.containers // []) + (.spec.initContainers // []))[]
            | (.securityContext.readOnlyRootFilesystem == true) as $ok
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " container=\(.name) image=\(.image)"
              + " readOnlyRootFilesystem=\(if .securityContext.readOnlyRootFilesystem == null then "unset" else .securityContext.readOnlyRootFilesystem end)"
              + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Set `securityContext.readOnlyRootFilesystem: true`. If the container must
          write, mount an `emptyDir` at the writable path instead of leaving the
          whole root filesystem writable.
        scored: true

      - id: C1.7
        text: "Pods do not mount hostPath volumes (Automated)"
        severity: high
        references: ["cis:5.2.11"]
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | [ (.spec.volumes // [])[] | select(.hostPath != null) ] as $hp
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + (if ($hp | length) == 0 then "" else " hostPaths=\([ $hp[] | .hostPath.path ] | join("+"))" end)
              + " is_compliant=\(if ($hp | length) > 0 then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Remove `hostPath` volumes. They expose the node filesystem to the pod;
          use PersistentVolumes, `emptyDir`, or projected volumes instead.
        scored: true

      - id: C1.8
        text: "Containers set CPU and memory limits (Automated)"
        severity: medium
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | (.spec.containers // [])[]
            | ((.resources.limits.cpu != null) and (.resources.limits.memory != null)) as $ok
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " container=\(.name) image=\(.image)"
              + " limitsCpu=\(.resources.limits.cpu // "unset") limitsMemory=\(.resources.limits.memory // "unset")"
              + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Set `resources.limits.cpu` and `resources.limits.memory` on every
          container so a single workload cannot exhaust a node.
        scored: true

      - id: C1.9
        text: "Containers set CPU and memory requests (Automated)"
        severity: low
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | (.spec.containers // [])[]
            | ((.resources.requests.cpu != null) and (.resources.requests.memory != null)) as $ok
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " container=\(.name) image=\(.image)"
              + " requestsCpu=\(.resources.requests.cpu // "unset") requestsMemory=\(.resources.requests.memory // "unset")"
              + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Set `resources.requests.cpu` and `resources.requests.memory` so the
          scheduler can place the pod correctly and QoS is not BestEffort.
        scored: true

      - id: C1.10
        text: "Container images are not tagged :latest or untagged (Automated)"
        severity: low
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | ((.spec.containers // []) + (.spec.initContainers // []))[]
            | .image as $img
            | (($img | contains("@")) or (($img | split("/") | last | contains(":")) and (($img | endswith(":latest")) | not))) as $ok
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " container=\(.name) image=\($img)"
              + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Pin images to an immutable tag or a digest (image@sha256:...). `:latest`
          and untagged images make deployments non-reproducible and hard to audit.
        scored: true

      - id: C1.11
        text: "Mutable image tags use imagePullPolicy Always (Automated)"
        severity: low
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | ((.spec.containers // []) + (.spec.initContainers // []))[]
            | .image as $img
            | (($img | contains("@")) or (($img | split("/") | last | contains(":")) and (($img | endswith(":latest")) | not))) as $immutable
            | ($immutable or (.imagePullPolicy == "Always")) as $ok
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " container=\(.name) image=\($img) imagePullPolicy=\(.imagePullPolicy // "unset")"
              + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          For mutable tags (:latest or untagged) set `imagePullPolicy: Always` so a
          node cannot silently run a stale cached image.
        scored: true

      - id: C1.12
        text: "Containers define liveness and readiness probes (Automated)"
        severity: low
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | (.spec.containers // [])[]
            | (.livenessProbe != null) as $live
            | (.readinessProbe != null) as $ready
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " container=\(.name) image=\(.image) livenessProbe=\($live) readinessProbe=\($ready)"
              + " is_compliant=\(if ($live and $ready) then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Define both `livenessProbe` and `readinessProbe` on each long-running
          container so Kubernetes can restart hung pods and keep traffic off pods
          that are not ready.
        scored: true

  - id: 2
    text: "RBAC & ServiceAccounts"
    checks:
      - id: C2.1
        text: "No ServiceAccount is bound to cluster-admin (Automated)"
        severity: critical
        references: ["cis:5.1.1", "eks:4.1.1", "gke:4.1.1", "aks:4.1.1"]
        audit: |
          kubectl get clusterrolebindings -o json | jq -r '
            [ .items[]
              | select(.roleRef.name == "cluster-admin")
              | .metadata as $m
              | ((.subjects // [])[] | select(.kind == "ServiceAccount"))
              | "kind=ClusterRoleBinding name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " sa=\(.namespace)/\(.name) roleRef=cluster-admin is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Do not bind ServiceAccounts to the cluster-admin ClusterRole. Grant a
          narrowly-scoped Role/ClusterRole with only the verbs the workload needs,
          then delete the binding: kubectl delete clusterrolebinding [name].
          This check emits one row per violation; a clean cluster emits the
          `is_compliant=true` sentinel and passes.
        scored: true

      - id: C2.2
        text: "Pods that don't need the API disable token automount (Automated)"
        severity: medium
        references: ["cis:5.1.6", "eks:4.1.6", "gke:4.1.5", "aks:4.1.6"]
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | (.spec.automountServiceAccountToken == false) as $ok
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " serviceAccount=\(.spec.serviceAccountName // "default")"
              + " automountServiceAccountToken=\(if .spec.automountServiceAccountToken == null then "unset" else .spec.automountServiceAccountToken end)"
              + " is_compliant=\(if $ok then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Set `automountServiceAccountToken: false` on the pod (or its
          ServiceAccount) unless the workload calls the Kubernetes API. A mounted
          token is a ready-made credential for an attacker who lands in the pod.
          ponytail: pod-level check; workloads that legitimately call the API will
          flag here and should be reviewed rather than blindly remediated.
        scored: true

      - id: C2.3
        text: "pods/exec is not granted to broad subjects (Automated)"
        severity: high
        audit: |
          # "Broad" is the set of built-in subjects that stand in for everyone:
          # system:authenticated, system:unauthenticated, system:anonymous and
          # system:serviceaccounts. A binding to a named user or a single SA is not flagged.
          # Both docs stream in on stdin and are slurped: --argjson would put a whole
          # cluster of JSON on argv and trip ARG_MAX (jq: Argument list too long).
          { kubectl get roles,clusterroles --all-namespaces -o json
            kubectl get rolebindings,clusterrolebindings --all-namespaces -o json
          } | jq -rs '
            .[0] as $roles | .[1] |
            def broad: ["system:authenticated","system:unauthenticated","system:anonymous","system:serviceaccounts"];
            [ $roles.items[]
              | select(any(.rules[]?;
                  (any(.resources[]?; . == "pods/exec" or . == "*"))
                  and (any(.verbs[]?; . == "create" or . == "*"))))
              | { kind: .kind, ns: (.metadata.namespace // ""), name: .metadata.name } ] as $execRoles
            | [ .items[]
              | .kind as $kind | .metadata as $m | .roleRef as $ref
              | select(any($execRoles[];
                  .name == $ref.name and .kind == $ref.kind
                  and (.ns == "" or .ns == ($m.namespace // ""))))
              | ((.subjects // [])[] | select(.name as $n | broad | index($n)))
              | "kind=\($kind)"
                + (if ($m.namespace // "") == "" then "" else " ns=\($m.namespace)" end)
                + " name=\($m.name) uid=\($m.uid) apiVersion=rbac.authorization.k8s.io/v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " subject=\(.name) roleRef=\($ref.kind)/\($ref.name) grants=pods/exec is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Review Roles/ClusterRoles that grant `create` on `pods/exec`. Exec into a
          running pod bypasses image immutability and admission controls; restrict
          it to a small set of named human operators.
        scored: true

      - id: C2.4
        text: "No RoleBinding grants access to anonymous/unauthenticated (Automated)"
        severity: critical
        references: ["gke:4.1.8", "gke:4.1.9"]
        audit: |
          kubectl get rolebindings,clusterrolebindings --all-namespaces -o json | jq -r '
            [ .items[]
              | .kind as $kind | .apiVersion as $api | .metadata as $m
              | ((.subjects // [])[] | select(.name == "system:anonymous" or .name == "system:unauthenticated"))
              | "kind=\($kind)"
                + (if ($m.namespace // "") == "" then "" else " ns=\($m.namespace)" end)
                + " name=\($m.name) uid=\($m.uid)"
                + (if ($api // "") == "" then "" else " apiVersion=\($api)" end)
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + " subject=\(.name) is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Delete any (Cluster)RoleBinding whose subject is `system:anonymous` or the
          `system:unauthenticated` group. These grant access to unauthenticated
          callers. This check emits one row per violation; a clean cluster emits the
          `is_compliant=true` sentinel and passes.
        scored: true

  - id: 3
    text: "Namespace Tenancy & Network Isolation"
    checks:
      - id: C3.1
        text: "Every non-system namespace has a default-deny NetworkPolicy (Automated)"
        severity: high
        references: ["cis:5.3.2", "eks:4.3.2", "gke:4.3.2", "aks:4.4.2"]
        audit: |
          # Both docs stream in on stdin and are slurped: --argjson would put a whole
          # cluster of JSON on argv and trip ARG_MAX (jq: Argument list too long).
          { kubectl get networkpolicies --all-namespaces -o json
            kubectl get namespaces -o json
          } | jq -rs '
            .[0] as $nps | .[1] |
            [ .items[]
            | select(.metadata.name as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ $nps.items[]
                 | select(.metadata.namespace == $m.name)
                 | select((.spec.podSelector == {}) or (.spec.podSelector.matchLabels == null and .spec.podSelector.matchExpressions == null))
                 | select((.spec.policyTypes // []) | index("Ingress")) ] | length) as $deny
            | "kind=Namespace name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $labels == "" then "" else " labels=\($labels)" end)
              + " defaultDenyPolicies=\($deny)"
              + " is_compliant=\(if $deny > 0 then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Apply a default-deny NetworkPolicy (empty podSelector, policyTypes:
          [Ingress]) to each application namespace, then allow only the flows you
          need. Without one, every pod is reachable from every other pod.
        scored: true

      - id: C3.2
        text: "No workloads run in the default namespace (Automated)"
        severity: medium
        references: ["cis:5.6.4", "eks:4.5.2", "aks:4.5.2"]
        audit: |
          # Both docs stream in on stdin and are slurped: --argjson would put a whole
          # cluster of JSON on argv and trip ARG_MAX (jq: Argument list too long).
          { kubectl get pods -n default -o json
            kubectl get namespace default -o json
          } | jq -rs '
            .[0] as $pods | .[1] |
            .metadata as $m
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | (($pods.items // []) | length) as $count
            | "kind=Namespace name=default uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $labels == "" then "" else " labels=\($labels)" end)
              + " podCount=\($count)"
              + " is_compliant=\(if $count == 0 then "true" else "false" end)"'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Move workloads out of the `default` namespace into purpose-specific
          namespaces so RBAC, quotas and NetworkPolicies can be scoped per tenant.
        scored: true

      - id: C3.3
        text: "Namespaces enforce Pod Security Admission (baseline or stricter) (Automated)"
        severity: high
        references: ["cis:5.2.1"]
        audit: |
          kubectl get namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.name as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | (($m.labels // {})["pod-security.kubernetes.io/enforce"] // "") as $lvl
            | "kind=Namespace name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $labels == "" then "" else " labels=\($labels)" end)
              + " enforce=\(if $lvl == "" then "none" else $lvl end)"
              + " is_compliant=\(if ($lvl == "baseline" or $lvl == "restricted") then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Label each namespace with
          `pod-security.kubernetes.io/enforce: baseline` (or `restricted`) so the
          built-in Pod Security Admission controller rejects unsafe pods.
        scored: true

      - id: C3.4
        text: "Tenant namespaces have a ResourceQuota (Automated)"
        severity: low
        audit: |
          # Both docs stream in on stdin and are slurped: --argjson would put a whole
          # cluster of JSON on argv and trip ARG_MAX (jq: Argument list too long).
          { kubectl get resourcequotas --all-namespaces -o json
            kubectl get namespaces -o json
          } | jq -rs '
            .[0] as $quotas | .[1] |
            [ .items[]
            | select(.metadata.name as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ $quotas.items[] | select(.metadata.namespace == $m.name) ] | length) as $count
            | "kind=Namespace name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $labels == "" then "" else " labels=\($labels)" end)
              + " resourceQuotas=\($count)"
              + " is_compliant=\(if $count > 0 then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Create a ResourceQuota per tenant namespace to bound aggregate CPU,
          memory and object counts, preventing one tenant from starving others.
        scored: true

  - id: 4
    text: "Secrets & Config Hygiene"
    checks:
      - id: C4.1
        text: "Sensitive values are not passed as literal env vars (Automated)"
        severity: medium
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
              | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
              | .metadata as $m
              | (.spec.nodeName // "") as $node
              | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
              | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
              | ((.spec.containers // []) + (.spec.initContainers // []))[]
              | .name as $c
              | (.env // [])[]
              | select((.value != null) and (.name | test("PASSWORD|SECRET|TOKEN|APIKEY|API_KEY|CREDENTIAL|PRIVATE_KEY"; "i")))
              | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
                + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
                + (if $node   == ""   then "" else " node=\($node)" end)
                + (if $labels == ""   then "" else " labels=\($labels)" end)
                + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
                + " container=\($c) env=\(.name) is_compliant=false"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Reference secrets via `valueFrom.secretKeyRef` or a mounted Secret volume
          instead of a literal `value:`. Literal values land in the pod manifest,
          logs and `kubectl describe`. Only the variable name is reported, never its
          value. This check emits one row per violation; a clean cluster emits the
          `is_compliant=true` sentinel and passes.
        scored: true

      - id: C4.2
        text: "Prefer bound/projected ServiceAccount tokens over Secret tokens (Manual)"
        severity: low
        # Deliberately NOT automated. Finding these means listing Secrets, and Kubernetes RBAC
        # has no metadata-only read — `list` on secrets returns their data. Granting the
        # scanner read access to every secret in the cluster costs more than this check is
        # worth, so it stays manual and the ClusterRole stays free of `secrets`.
        type: "manual"
        remediation: |
          Avoid long-lived ServiceAccount token Secrets; use projected
          (TokenRequest) tokens with an audience and expiry instead.
          Review with: kubectl get secrets -A --field-selector type=kubernetes.io/service-account-token
        scored: false

  - id: 5
    text: "Availability & Resource Governance"
    checks:
      - id: C5.1
        text: "Multi-replica Deployments have a PodDisruptionBudget (Automated)"
        severity: low
        audit: |
          # A PDB matches by label selector, so the check is "does some PDB in this namespace
          # select this Deployment's pod labels", not a name lookup. Only matchLabels is
          # evaluated; a PDB using matchExpressions is not counted as covering.
          # Both docs stream in on stdin and are slurped: --argjson would put a whole
          # cluster of JSON on argv and trip ARG_MAX (jq: Argument list too long).
          { kubectl get poddisruptionbudgets --all-namespaces -o json
            kubectl get deployments --all-namespaces -o json
          } | jq -rs '
            .[0] as $pdbs | .[1] |
            [ .items[]
            | select((.spec.replicas // 1) > 1)
            | .metadata as $m
            | (.spec.template.metadata.labels // {}) as $podLabels
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ $pdbs.items[]
                 | select(.metadata.namespace == $m.namespace)
                 | select((.spec.selector.matchLabels // {}) | length > 0)
                 | select([ (.spec.selector.matchLabels | to_entries)[]
                            | $podLabels[.key] == .value ] | all)
               ] | length) as $count
            | "kind=Deployment ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=apps/v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $labels == "" then "" else " labels=\($labels)" end)
              + " replicas=\(.spec.replicas) podDisruptionBudgets=\($count)"
              + " is_compliant=\(if $count > 0 then "true" else "false" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Define a PodDisruptionBudget for each multi-replica Deployment so node
          drains and rollouts keep a minimum number of pods available.
        scored: true

      - id: C5.2
        text: "Pods are managed by a controller (no naked pods) (Automated)"
        severity: low
        audit: |
          kubectl get pods --all-namespaces -o json | jq -r '
            [ .items[]
            | select(.metadata.namespace as $n | ["kube-system","kube-public","kube-node-lease"] | index($n) | not)
            | .metadata as $m
            | (.spec.nodeName // "") as $node
            | (($m.labels // {}) | to_entries | map("\(.key):\(.value)") | join(",")) as $labels
            | ([ ($m.ownerReferences // [])[] | select(.controller) ] | first) as $own
            | "kind=Pod ns=\($m.namespace) name=\($m.name) uid=\($m.uid) apiVersion=v1"
              + (if ($m.creationTimestamp // "") == "" then "" else " created=\($m.creationTimestamp)" end)
              + (if $node   == ""   then "" else " node=\($node)" end)
              + (if $labels == ""   then "" else " labels=\($labels)" end)
              + (if $own    == null then "" else " owner=\($own.kind)/\($m.namespace)/\($own.name)/\($own.uid)" end)
              + " is_compliant=\(if $own == null then "false" else "true" end)"
            ] as $rows
            | if ($rows | length) == 0 then "is_compliant=true" else $rows[] end'
        use_multiple_values: true
        tests:
          test_items:
            - flag: "is_compliant"
              compare:
                op: eq
                value: true
        remediation: |
          Manage pods through a controller (Deployment, StatefulSet, DaemonSet,
          Job). A naked pod is not rescheduled if its node dies.
        scored: true
